<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0F766E">
<title>WeSpot admin</title>
<link rel="icon" href="icons/icon-192.png">
<style>
  :root { --ink: #17202A; --muted: #4A5560; --line: #DDE2E7; --soft: #F3F5F7; --brand: #0F766E; --brand-dark: #115E59; --bg: #F6F8F9; font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); }
  header { background: var(--brand); color: #fff; padding: 14px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 20px; flex: 1; min-width: 160px; }
  header a, header button { color: #fff; background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.35); border-radius: 20px; padding: 8px 14px; font: inherit; font-weight: 700; font-size: 14px; text-decoration: none; cursor: pointer; }
  main { max-width: 1040px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
  h2 { margin: 0 0 10px; font-size: 17px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
  .msg { text-align: center; padding: 40px 16px; color: var(--muted); }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; min-width: 0; }
  .kpi { min-width: 0; background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
  .kpi.big { background: var(--brand); color: #fff; border-color: var(--brand); }
  .kpi b { display: block; font-size: 32px; line-height: 1.1; letter-spacing: -1px; }
  .kpi span { font-size: 13px; color: var(--muted); }
  .kpi.big span { color: #CCFBF1; }
  .two { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
  .bars { display: grid; gap: 8px; }
  .bar { display: grid; grid-template-columns: 110px 1fr 40px; align-items: center; gap: 8px; font-size: 14px; }
  .bar i { display: block; height: 14px; border-radius: 7px; background: var(--brand); min-width: 2px; }
  .bar em { font-style: normal; text-align: right; font-weight: 700; }
  .track { background: var(--soft); border-radius: 7px; }
  svg.chart { width: 100%; height: 120px; display: block; }
  .muted { color: var(--muted); font-size: 13px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
  .btn { border: 0; border-radius: 12px; padding: 10px 14px; font: inherit; font-weight: 700; background: var(--brand); color: #fff; cursor: pointer; text-decoration: none; display: inline-block; font-size: 14px; }
  .btn.ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); }
  input[type=search] { flex: 1; min-width: 180px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; font: inherit; }
  .tbl { overflow-x: auto; max-height: 420px; overflow-y: auto; border: 1px solid var(--line); border-radius: 12px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { position: sticky; top: 0; background: var(--soft); font-size: 12px; text-transform: uppercase; letter-spacing: .4px; color: var(--muted); }
  .links { display: flex; flex-wrap: wrap; gap: 8px; }
  .usage { margin: 8px 0 12px; }
  .usage .track { height: 12px; overflow: hidden; }
  .usage i { display: block; height: 100%; background: var(--brand); }
  .usage i.warn { background: #D97706; }
  .usage i.bad { background: #DC2626; }
  .usage div:first-child { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 4px; }
  .tform { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
  .tform label { display: grid; gap: 4px; font-size: 13px; font-weight: 700; color: var(--muted); }
  .tform .wide { grid-column: 1 / -1; }
  .tform input, .tform select, .tform textarea { padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; font: inherit; font-weight: 400; color: var(--ink); background: #fff; width: 100%; }
  .tform textarea { min-height: 80px; resize: vertical; }
  .made { margin-top: 14px; padding: 14px; border-radius: 14px; background: #ECFDF5; border: 2px solid #16A34A; display: grid; gap: 8px; }
  .made code, td code { font-size: 15px; font-weight: 700; letter-spacing: 1px; }
  .made .claim { font-size: 26px; letter-spacing: 3px; }
  .nfc { padding: 12px 14px; border-radius: 12px; font-weight: 700; text-align: center; border: 2px solid transparent; }
  .nfc.wait { background: #FEF3C7; color: #92400E; border-color: #F59E0B; }
  .nfc.ok { background: #DCFCE7; color: #166534; border-color: #16A34A; }
  .nfc.err { background: #FEE2E2; color: #991B1B; border-color: #DC2626; }
  .pill { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 13px; font-weight: 700; }
  .pill.wait { background: #FEF3C7; color: #92400E; }
  .pill.ok { background: #DCFCE7; color: #166534; }
  .btn.small { padding: 6px 10px; font-size: 13px; }
  .btn.danger { background: #fff; color: #B91C1C; border: 1px solid #FCA5A5; }
  .reqs { display: grid; gap: 10px; }
  .req { border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: grid; gap: 6px; font-size: 14px; }
  .req.nuova { border: 2px solid #F59E0B; background: #FFFBEB; }
  .req-head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .req-head strong { font-size: 16px; }
  .req img { width: 64px; height: 64px; object-fit: cover; border-radius: 12px; float: right; margin-left: 10px; }
  .req .msgtxt { white-space: pre-wrap; background: var(--soft); border-radius: 10px; padding: 8px 10px; }
  .req a { color: var(--brand); }
  .pill.no { background: #F3F4F6; color: #4B5563; }
  .share { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .share img { width: 150px; height: 150px; image-rendering: pixelated; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
  .from-req { padding: 10px 12px; border-radius: 12px; background: #FEF3C7; color: #92400E; font-weight: 700; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
</style>
</head>
<body>
<header>
  <h1>WeSpot · pannello admin</h1>
  <span id="upd" class="muted" style="color:#CCFBF1"></span>
  <button type="button" id="refresh" hidden>Aggiorna</button>
  <a href="./">Torna all'app</a>
</header>
<main id="main"><div class="msg" id="status">Carico…</div></main>

<script src="vendor/supabase/supabase.js"></script>
<script src="vendor/qrcode/qrcode.js"></script>
<script src="config.js"></script>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const CFG = window.SPOTIT_CONFIG || {};
  const main = $('main');
  const nf = new Intl.NumberFormat('it-IT');
  const n = v => nf.format(Number(v) || 0);
  const mb = b => { b = Number(b) || 0; return b >= 1e9 ? (b / 1e9).toFixed(2) + ' GB' : (b / 1e6).toFixed(1) + ' MB'; };
  const date = (t, withTime) => t ? new Date(t).toLocaleString('it-IT', withTime ? { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' } : { day: 'numeric', month: 'short', year: 'numeric' }) : '—';
  function el(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (k === 'class') e.className = v; else if (k.startsWith('on')) e[k] = v; else if (v !== false && v != null) e.setAttribute(k, v);
    }
    for (const c of kids.flat()) if (c != null) e.append(c.nodeType ? c : document.createTextNode(String(c)));
    return e;
  }
  function say(text) { main.replaceChildren(el('div', { class: 'msg' }, text)); $('refresh').hidden = true; }

  if (!CFG.supabaseUrl || !window.supabase) { say('Archivio non disponibile.'); return; }
  // Stessa sessione dell'app (stesso indirizzo), senza rinnovi automatici in parallelo
  const sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey, {
    auth: { persistSession: true, autoRefreshToken: false, detectSessionInUrl: false, storageKey: 'spotit.auth' }
  });

  function bars(rows, color) {
    const max = Math.max(1, ...rows.map(r => r[1]));
    return el('div', { class: 'bars' }, rows.map(([label, v]) =>
      el('div', { class: 'bar' }, el('span', {}, label), el('div', { class: 'track' }, el('i', { style: `width:${Math.max(1, Math.round(v / max * 100))}%;${color ? 'background:' + color : ''}` })), el('em', {}, n(v)))));
  }
  function chart(days, title) {
    const W = 600, H = 120, gap = 3, bw = (W - gap * (days.length - 1)) / days.length;
    const max = Math.max(1, ...days.map(d => d.n));
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.setAttribute('class', 'chart'); svg.setAttribute('role', 'img');
    svg.setAttribute('aria-label', `${title}: ${days.map(d => d.d + ' ' + d.n).join(', ')}`);
    svg.setAttribute('preserveAspectRatio', 'none');
    days.forEach((d, i) => {
      const h = d.n ? Math.max(3, d.n / max * (H - 16)) : 1;
      const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      r.setAttribute('x', i * (bw + gap)); r.setAttribute('y', H - h); r.setAttribute('width', bw); r.setAttribute('height', h);
      r.setAttribute('rx', 2); r.setAttribute('fill', d.n ? '#0F766E' : '#DDE2E7');
      const t = document.createElementNS('http://www.w3.org/2000/svg', 'title'); t.textContent = `${date(d.d)}: ${d.n}`; r.append(t);
      svg.append(r);
    });
    return svg;
  }
  function usage(label, used, limit) {
    const p = Math.min(100, used / limit * 100);
    return el('div', { class: 'usage' },
      el('div', {}, el('span', {}, label), el('span', {}, `${mb(used)} su ${mb(limit)}`)),
      el('div', { class: 'track' }, el('i', { class: p > 90 ? 'bad' : p > 70 ? 'warn' : '', style: `width:${Math.max(1, p)}%` })));
  }
  const kpi = (v, l, big) => el('div', { class: 'kpi' + (big ? ' big' : '') }, el('b', {}, n(v)), el('span', {}, l));
  const VERDICT = { tornarci: ['Tornarci', '#15803D'], andarci: ['Andarci', '#1D4ED8'], sconsigliato: ['Sconsigliato', '#C2410C'], appuntamento: ['Appuntamento', '#7C3AED'], consigliato: ['Tornarci', '#15803D'], nonandarci: ['Sconsigliato', '#C2410C'] };

  function usersCard(users) {
    const emails = [...new Set(users.map(u => (u.email || '').trim()).filter(Boolean))];
    const search = el('input', { type: 'search', placeholder: 'Cerca per email o nome', 'aria-label': 'Cerca iscritti' });
    const body = el('tbody');
    const note = el('p', { class: 'muted' });
    const draw = () => {
      const q = search.value.trim().toLowerCase();
      const list = users.filter(u => !q || (u.email || '').toLowerCase().includes(q) || (u.name || '').toLowerCase().includes(q));
      body.replaceChildren(...list.map(u => el('tr', {}, el('td', {}, u.email || '—'), el('td', {}, u.name || '—'), el('td', {}, date(u.joined)), el('td', {}, date(u.last_seen, true)), el('td', {}, n(u.places)))));
    };
    search.oninput = draw; draw();
    const copy = el('button', { type: 'button', class: 'btn ghost', onclick: async () => {
      try { await navigator.clipboard.writeText(emails.join(', ')); note.textContent = `Copiate ${n(emails.length)} email: incollale nel campo "Ccn" della tua posta.`; }
      catch { note.textContent = 'Non riesco a copiare: seleziona le email dalla tabella.'; }
    } }, 'Copia tutte le email');
    const mailto = () => {
      const bcc = emails.map(encodeURIComponent).join(',');
      if (bcc.length > 1800) { note.textContent = 'Sono troppe per aprire la posta con un tocco: usa "Copia tutte le email" e incollale nel campo Ccn.'; return; }
      location.href = `mailto:?bcc=${bcc}&subject=${encodeURIComponent('Novità su WeSpot')}`;
    };
    return el('section', { class: 'card' },
      el('h2', {}, `Iscritti (${n(users.length)})`),
      el('div', { class: 'row' }, search,
        el('button', { type: 'button', class: 'btn', onclick: mailto }, '✉️ Scrivi a tutti'), copy),
      note,
      el('p', { class: 'muted' }, 'La posta si apre con tutti in copia nascosta (Ccn): nessuno vede le email degli altri. Scrivi solo comunicazioni di servizio (novità e aggiornamenti dell\'app).'),
      el('div', { class: 'tbl' }, el('table', {}, el('thead', {}, el('tr', {}, ['Email', 'Nome', 'Iscritto dal', 'Ultimo accesso', 'Posti'].map(h => el('th', {}, h)))), body)));
  }

  // ---------- Tag NFC per i clienti ----------
  const TAG_KINDS = { animale: '🐾 Animale', dpi: '⛑️ DPI', abiti: '👕 Abiti', oggetto: '🔑 Oggetto', altro: '📲 Altro' };
  const tagLink = id => `https://wespot.me/#t=${id}`;
  const claimNice = c => String(c || '').replace(/^(.{4})(.{4})$/, '$1-$2');
  const cardText = c => `Il tuo tag WeSpot\n1. Apri wespot.me e installa WeSpot\n2. Entra con il tuo account\n3. Menu › Tag NFC › Collega un tag\n4. Scrivi il codice: ${claimNice(c)}\nOppure apri: wespot.me/#attiva=${c}`;
  let tagsCard = null, tagsBody = null, tagsNote = null, madeBox = null, fromBox = null, fromRequest = null;
  let reqCard = null, reqList = null, reqNote = null, reqShowAll = false, reqData = [];
  const REQ_URL = 'https://wespot.me/richiesta.html';

  // ---------- Richieste dalla scheda pubblica ----------
  function setFromRequest(r) {
    fromRequest = r;
    if (!fromBox) return;
    fromBox.hidden = !r;
    if (!r) { fromBox.replaceChildren(); return; }
    fromBox.replaceChildren(
      r.photo ? el('img', { src: r.photo, alt: '', style: 'width:44px;height:44px;border-radius:10px;object-fit:cover' }) : null,
      el('span', { style: 'flex:1' }, `Dalla richiesta di ${r.buyer_name}${r.photo ? ' (con la sua foto)' : ''}: controlla i dati e tocca "Crea".`),
      el('button', { type: 'button', class: 'btn ghost small', onclick: () => setFromRequest(null) }, 'Lascia stare'));
  }
  function useRequest(r) {
    $('tKind').value = r.kind; $('tName').value = r.name || ''; $('tMsg').value = r.message || '';
    $('tPhone').value = r.phone || ''; $('tClient').value = r.buyer_name || '';
    setFromRequest(r);
    tagsCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  function qrImage(text) {
    if (!window.qrcode) return null;
    const q = window.qrcode(0, 'M'); q.addData(text); q.make();
    return q.createDataURL(8, 16);
  }
  async function downloadQr() {
    const src = qrImage(REQ_URL); if (!src) return;
    const img = new Image(); img.src = src; await img.decode().catch(() => {});
    const c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
    c.getContext('2d').drawImage(img, 0, 0);
    const a = document.createElement('a'); a.href = c.toDataURL('image/png'); a.download = 'qr-richiesta-tag-wespot.png'; a.click();
  }
  function drawRequests() {
    if (!reqCard) return;
    if (reqData === null) { reqList.replaceChildren(el('p', { class: 'muted' }, 'Manca l\'aggiornamento dell\'archivio per le richieste.')); return; }
    const open = reqData.filter(r => r.status === 'nuova');
    const list = reqShowAll ? reqData : open;
    reqCard.querySelector('h2').textContent = `📝 Richieste dei clienti${open.length ? ` (${open.length} da fare)` : ''}`;
    if (!list.length) { reqList.replaceChildren(el('p', { class: 'muted' }, reqShowAll ? 'Ancora nessuna richiesta.' : 'Nessuna richiesta da fare.')); return; }
    reqList.replaceChildren(...list.map(r => {
      const tel = String(r.buyer_phone || '');
      return el('div', { class: 'req ' + r.status },
        el('div', { class: 'req-head' },
          el('strong', {}, r.buyer_name),
          r.status === 'nuova' ? el('span', { class: 'pill wait' }, '⏳ Da fare') : r.status === 'evasa' ? el('span', { class: 'pill ok' }, '✅ Tag creato') : el('span', { class: 'pill no' }, 'Annullata'),
          el('span', { class: 'muted' }, date(r.created_at, true))),
        el('div', {}, r.photo ? el('img', { src: r.photo, alt: '' }) : null,
          el('div', {}, el('b', {}, `${(TAG_KINDS[r.kind] || '')} · ${r.name}`)),
          r.message ? el('div', { class: 'msgtxt' }, r.message) : null,
          r.phone ? el('div', {}, `Telefono sul tag: ${r.phone}`) : null),
        el('div', {}, '📬 ', r.buyer_email ? el('a', { href: `mailto:${r.buyer_email}` }, r.buyer_email) : null,
          r.buyer_email && tel ? ' · ' : null,
          tel ? el('a', { href: `tel:${tel}` }, tel) : null,
          tel ? [' · ', el('a', { href: `https://wa.me/${tel.replace(/\D/g, '').replace(/^(3\d{8,9})$/, '39$1')}`, target: '_blank', rel: 'noopener' }, 'WhatsApp')] : null),
        r.address ? el('div', {}, `🏠 ${r.address}`) : null,
        r.notes ? el('div', {}, `🖨️ ${r.notes}`) : null,
        el('div', { class: 'row', style: 'margin:4px 0 0' },
          r.status === 'nuova' ? el('button', { type: 'button', class: 'btn small', onclick: () => useRequest(r) }, '🎁 Crea tag') : null,
          r.status === 'nuova' ? el('button', { type: 'button', class: 'btn ghost small', onclick: () => setRequest(r, 'annullata') }, 'Annulla') : null,
          r.status === 'annullata' ? el('button', { type: 'button', class: 'btn ghost small', onclick: () => setRequest(r, 'nuova') }, 'Rimetti da fare') : null));
    }));
  }
  async function setRequest(r, status) {
    const { error } = await sb.rpc('admin_set_request', { p_id: r.id, p_status: status });
    reqNote.textContent = error ? 'Non riesco a cambiarla ora, riprova.' : '';
    refreshRequests();
  }
  async function refreshRequests() {
    const { data, error } = await sb.rpc('admin_tag_requests');
    reqData = error ? null : data || [];
    drawRequests();
  }
  function makeReqCard() {
    if (reqCard) return reqCard;
    reqList = el('div', { class: 'reqs' });
    reqNote = el('p', { class: 'muted', role: 'status' });
    const qr = qrImage(REQ_URL);
    const toggle = el('button', { type: 'button', class: 'btn ghost small', onclick: () => { reqShowAll = !reqShowAll; toggle.textContent = reqShowAll ? 'Solo da fare' : 'Mostra anche quelle fatte'; drawRequests(); } }, 'Mostra anche quelle fatte');
    reqCard = el('section', { class: 'card' },
      el('h2', {}, '📝 Richieste dei clienti'),
      el('div', { class: 'share' },
        qr ? el('img', { src: qr, alt: 'QR code della scheda richiesta' }) : null,
        el('div', { style: 'flex:1;min-width:220px' },
          el('p', { style: 'margin:0 0 8px' }, 'Scheda da far compilare ai clienti: ', el('a', { href: REQ_URL, target: '_blank', rel: 'noopener' }, REQ_URL)),
          el('p', { class: 'muted', style: 'margin:0 0 10px' }, 'Quando qualcuno la invia ti arriva una notifica e la richiesta compare qui sotto.'),
          el('div', { class: 'row' },
            el('button', { type: 'button', class: 'btn ghost', onclick: async () => { try { await navigator.clipboard.writeText(REQ_URL); reqNote.textContent = 'Link copiato.'; } catch { reqNote.textContent = REQ_URL; } } }, 'Copia link'),
            qr ? el('button', { type: 'button', class: 'btn ghost', onclick: downloadQr }, '⬇️ Scarica QR code') : null))),
      reqNote,
      el('div', { class: 'row', style: 'justify-content:flex-end' }, toggle),
      reqList);
    return reqCard;
  }

  async function copy(text, okMsg) {
    try { await navigator.clipboard.writeText(text); tagsNote.textContent = okMsg; }
    catch { tagsNote.textContent = text; }
  }
  function printCard(t) {
    const w = window.open('', '_blank', 'width=420,height=560');
    if (!w) { tagsNote.textContent = 'Il browser ha bloccato la finestra di stampa: usa "Copia testo".'; return; }
    const esc = v => String(v).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
    w.document.write(`<!doctype html><meta charset="utf-8"><title>Cartoncino ${esc(t.name || '')}</title>
<style>body{font-family:system-ui,sans-serif;margin:24px;color:#17202A}.c{border:2px solid #0F766E;border-radius:16px;padding:20px;max-width:340px}
h1{margin:0 0 4px;font-size:22px;color:#0F766E}p{margin:4px 0 12px;color:#4A5560}ol{padding-left:20px;line-height:1.6}
.code{font-size:30px;font-weight:800;letter-spacing:4px;text-align:center;margin:14px 0;padding:10px;background:#F3F5F7;border-radius:12px}
small{color:#4A5560}</style>
<div class="c"><h1>Il tuo tag WeSpot</h1><p>${esc(TAG_KINDS[t.kind] || '')} · ${esc(t.name || '')}</p>
<ol><li>Apri <b>wespot.me</b> e installa WeSpot</li><li>Entra con il tuo account</li><li>Menu › <b>Tag NFC</b> › <b>Collega un tag</b></li><li>Scrivi questo codice:</li></ol>
<div class="code">${esc(claimNice(t.claim_code))}</div><small>Oppure apri wespot.me/#attiva=${esc(t.claim_code)}</small></div>
<script>setTimeout(()=>print(),300)<\/script>`);
    w.document.close();
  }
  async function writeNfc(t, box) {
    if (!('NDEFReader' in window)) { box.className = 'nfc err'; box.textContent = '❌ Da questo dispositivo non si può scrivere: usa un telefono Android con Chrome, oppure copia il link e usa NFC Tools.'; box.hidden = false; return; }
    const ctrl = new AbortController(); const timer = setTimeout(() => ctrl.abort(), 30000);
    box.hidden = false; box.className = 'nfc wait'; box.textContent = '⏳ Appoggia ora il tag sul retro del telefono e tienilo fermo…';
    try {
      await new window.NDEFReader().write({ records: [{ recordType: 'url', data: tagLink(t.id) }] }, { overwrite: true, signal: ctrl.signal });
      box.className = 'nfc ok'; box.textContent = '✅ Registrazione avvenuta! Il tag è pronto.';
    } catch (e) {
      box.className = 'nfc err';
      box.textContent = '❌ Registrazione non avvenuta. ' + (e && e.name === 'AbortError' ? 'Nessun tag trovato in 30 secondi: riprova e appoggia subito il tag.' : 'Controlla che l\'NFC sia acceso e riprova tenendo il tag fermo.');
    } finally { clearTimeout(timer); }
  }
  function tagActions(t) {
    const box = el('div', { class: 'nfc', hidden: true });
    return [el('div', { class: 'row' },
      el('button', { type: 'button', class: 'btn', onclick: () => writeNfc(t, box) }, '📲 Scrivi sul tag'),
      el('button', { type: 'button', class: 'btn ghost', onclick: () => copy(tagLink(t.id), 'Link copiato: incollalo in NFC Tools (Scrivi › URL).') }, 'Copia link'),
      el('button', { type: 'button', class: 'btn ghost', onclick: () => printCard(t) }, '🖨️ Stampa cartoncino'),
      el('button', { type: 'button', class: 'btn ghost', onclick: () => copy(cardText(t.claim_code), 'Testo del cartoncino copiato.') }, 'Copia testo'),
      el('a', { class: 'btn ghost', href: `tag.html#t=${t.id}`, target: '_blank', rel: 'noopener' }, 'Prova la pagina')), box];
  }
  function drawTags(list) {
    if (!tagsCard) return;
    if (!list) { tagsBody.replaceChildren(el('tr', {}, el('td', { colspan: 6 }, 'Manca l\'aggiornamento dell\'archivio per i tag dei clienti.'))); return; }
    if (!list.length) { tagsBody.replaceChildren(el('tr', {}, el('td', { colspan: 6, class: 'muted' }, 'Nessun tag per i clienti, per ora.'))); return; }
    tagsBody.replaceChildren(...list.map(t => el('tr', {},
      el('td', {}, t.client || '—'),
      el('td', {}, `${(TAG_KINDS[t.kind] || '').split(' ')[0] || ''} ${t.name || ''}`),
      el('td', {}, el('code', {}, claimNice(t.claim_code))),
      el('td', {}, t.claimed_at ? el('span', { class: 'pill ok' }, `✅ Attivato ${date(t.claimed_at)}${t.owner_email ? ' · ' + t.owner_email : ''}`) : el('span', { class: 'pill wait' }, '⏳ Da attivare')),
      el('td', {}, n(t.sightings)),
      el('td', {}, el('span', { class: 'row', style: 'margin:0;flex-wrap:nowrap' },
        el('button', { type: 'button', class: 'btn ghost small', onclick: () => showMade(t) }, 'Apri'),
        t.claimed_at ? null : el('button', { type: 'button', class: 'btn danger small', onclick: async () => {
          if (!confirm(`Eliminare il tag "${t.name}"? Il link sul tag smette di funzionare.`)) return;
          const { error } = await sb.rpc('admin_delete_tag', { p_id: t.id });
          tagsNote.textContent = error ? 'Non riesco a eliminarlo (forse è già stato attivato).' : 'Tag eliminato.';
          refreshTags();
        } }, 'Elimina'))))));
  }
  function showMade(t) {
    madeBox.replaceChildren(
      el('strong', {}, `${(TAG_KINDS[t.kind] || '').split(' ')[0] || ''} ${t.name || 'Tag'}${t.client ? ' · ' + t.client : ''}`),
      el('div', {}, 'Codice di attivazione da mettere nella confezione:'),
      el('code', { class: 'claim' }, claimNice(t.claim_code)),
      el('div', { class: 'muted' }, `Link sul tag: ${tagLink(t.id)}`),
      ...tagActions(t));
    madeBox.hidden = false;
    madeBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
  async function refreshTags() {
    const { data, error } = await sb.rpc('admin_tags');
    drawTags(error ? null : data || []);
  }
  function makeTagsCard() {
    if (tagsCard) return tagsCard;
    const kind = el('select', { id: 'tKind' }, Object.entries(TAG_KINDS).map(([k, l]) => el('option', { value: k }, l)));
    const name = el('input', { id: 'tName', maxlength: 40, required: true, placeholder: 'Es. Fido, oppure Mario Rossi per un DPI' });
    const msg = el('textarea', { id: 'tMsg', maxlength: 500, placeholder: 'Messaggio per chi lo trova, o informazioni di emergenza' });
    const phone = el('input', { id: 'tPhone', type: 'tel', maxlength: 20, placeholder: 'Telefono del cliente (lo vede chi legge il tag)' });
    const client = el('input', { id: 'tClient', maxlength: 80, placeholder: 'Es. Mario Rossi, ordine 12 (lo vedi solo tu)' });
    const save = el('button', { type: 'submit', class: 'btn' }, '+ Crea tag per il cliente');
    tagsNote = el('p', { class: 'muted', role: 'status' });
    madeBox = el('div', { class: 'made', hidden: true });
    tagsBody = el('tbody');
    fromBox = el('div', { class: 'from-req', hidden: true });
    const form = el('form', { class: 'tform' },
      el('label', {}, 'Tipo', kind), el('label', {}, 'Nome', name), el('label', {}, 'Telefono', phone), el('label', {}, 'Cliente (nota per te)', client),
      el('label', { class: 'wide' }, 'Messaggio', msg), el('div', { class: 'wide' }, save));
    form.onsubmit = async e => {
      e.preventDefault();
      save.disabled = true; tagsNote.textContent = 'Creo il tag…';
      const req = fromRequest;
      const { data, error } = await sb.rpc('admin_create_tag', { p_kind: kind.value, p_name: name.value, p_message: msg.value, p_phone: phone.value, p_client: client.value,
        p_photo: req ? req.photo || '' : '', p_request: req ? req.id : null });
      save.disabled = false;
      if (error || !data) { tagsNote.textContent = 'Non riesco a creare il tag. Riprova tra poco.'; return; }
      tagsNote.textContent = 'Tag creato. Ora scrivilo sull\'oggetto e metti il codice nella confezione.';
      showMade({ id: data.id, claim_code: data.claim, kind: kind.value, name: name.value.trim(), client: client.value.trim() });
      name.value = ''; msg.value = ''; phone.value = ''; client.value = '';
      setFromRequest(null);
      refreshTags(); refreshRequests();
    };
    tagsCard = el('section', { class: 'card' },
      el('h2', {}, '🎁 Tag NFC per i clienti'),
      el('p', { class: 'muted' }, 'Crea il tag con i dati del cliente, scrivilo sull\'oggetto e spediscilo con il codice di attivazione. Finché il cliente non lo attiva, le segnalazioni arrivano a te; dopo passano a lui. Puoi modificare i dati dei tag non ancora attivati dall\'app, in Tag NFC.'),
      fromBox, form, tagsNote, madeBox,
      el('div', { class: 'tbl', style: 'margin-top:14px' }, el('table', {},
        el('thead', {}, el('tr', {}, ['Cliente', 'Tag', 'Codice', 'Stato', 'Segnalazioni', ''].map(h => el('th', {}, h)))), tagsBody)));
    return tagsCard;
  }

  function render(s, users, tags, reqs) {
    const u = s.users, p = s.places, o = s.outings, st = s.storage;
    const verdicts = Object.entries(p.by_verdict || {}).map(([k, v]) => [(VERDICT[k] || [k])[0], v, (VERDICT[k] || [])[1]]);
    const vbars = el('div', { class: 'bars' });
    const vmax = Math.max(1, ...verdicts.map(v => v[1]));
    verdicts.forEach(([l, v, c]) => vbars.append(el('div', { class: 'bar' }, el('span', {}, l), el('div', { class: 'track' }, el('i', { style: `width:${Math.max(1, Math.round(v / vmax * 100))}%;background:${c || '#0F766E'}` })), el('em', {}, n(v)))));
    main.replaceChildren(
      el('div', { class: 'kpis' },
        kpi(u.total, 'iscritti in totale', true), kpi(u.new_7d, 'nuovi negli ultimi 7 giorni'), kpi(u.new_30d, 'nuovi negli ultimi 30 giorni'),
        kpi(u.signed_in_7d, 'accessi negli ultimi 7 giorni'), kpi(u.with_places, 'hanno salvato almeno un posto'), kpi(u.not_sharing, 'non condividono i posti')),
      users ? usersCard(users) : null,
      makeReqCard(),
      makeTagsCard(),
      el('div', { class: 'two' },
        el('section', { class: 'card' }, el('h2', {}, 'Nuovi iscritti, ultimi 30 giorni'), chart(s.daily.signups, 'Nuovi iscritti')),
        el('section', { class: 'card' }, el('h2', {}, 'Posti salvati, ultimi 30 giorni'), chart(s.daily.places, 'Posti salvati'))),
      el('div', { class: 'kpis' },
        kpi(p.total, 'posti salvati'), kpi(p.new_7d, 'posti nuovi in 7 giorni'), kpi(p.shared, 'posti visibili agli altri'),
        kpi(o.groups, 'uscite di gruppo'), kpi(o.events, 'eventi privati'), kpi(o.public_events, 'eventi pubblici'),
        kpi(o.upcoming, 'uscite e eventi in programma'), kpi(o.going, 'conferme "Ci sono"'), kpi(s.notifications.phones, 'telefoni con le notifiche')),
      el('div', { class: 'two' },
        el('section', { class: 'card' }, el('h2', {}, 'Giudizi'), verdicts.length ? vbars : el('p', { class: 'muted' }, 'Ancora nessun posto.')),
        el('section', { class: 'card' }, el('h2', {}, 'Tipi di locale più salvati'),
          (p.top_kinds || []).length ? bars(p.top_kinds.map(k => [k.kind, k.n])) : el('p', { class: 'muted' }, 'Ancora nessun tipo indicato.'))),
      el('section', { class: 'card' },
        el('h2', {}, 'Spazio usato'),
        usage('Archivio dati (database)', st.db_bytes, 500e6),
        usage(`Foto dei posti (${n(st.photo_files)} file) e copertine (${n(st.cover_files)} file)`, Number(st.photo_bytes) + Number(st.cover_bytes), 5e8),
        el('p', { class: 'muted' }, 'Tetto che ci siamo dati: 500 MB per foto e copertine. Piano gratuito di Supabase: 500 MB di dati. Per i costi di Google (mappe e luoghi) usa i collegamenti qui sotto.')),
      el('section', { class: 'card' },
        el('h2', {}, 'Collegamenti utili'),
        el('div', { class: 'links' },
          [['Supabase (archivio e utenti)', 'https://supabase.com/dashboard/project/rznllkivahwgzmyzpxcb'],
           ['Google Cloud (costi e limiti)', 'https://console.cloud.google.com/billing'],
           ['Google Mappe: utilizzo', 'https://console.cloud.google.com/google/maps-apis/metrics'],
           ['Codice su GitHub', 'https://github.com/dpfphoto/spotit'],
           ['IONOS (dominio)', 'https://my.ionos.it']].map(([t, h]) => el('a', { class: 'btn ghost', href: h, target: '_blank', rel: 'noopener' }, t)))));
    drawTags(tags);
    reqData = reqs; drawRequests();
    $('upd').textContent = 'Aggiornato ' + date(s.generated_at, true);
    $('refresh').hidden = false;
  }

  async function load() {
    $('refresh').disabled = true;
    try {
      const { data: sess } = await sb.auth.getSession();
      if (!sess || !sess.session) { say('Per aprire il pannello entra prima nell\'app WeSpot con il tuo account, poi riapri questa pagina.'); return; }
      const adm = await sb.rpc('is_admin');
      if (adm.error) { say('Il pannello non è ancora attivo: manca un aggiornamento dell\'archivio.'); return; }
      if (adm.data !== true) { say('Questo account non ha accesso al pannello.'); return; }
      const [st, us, tg, rq] = await Promise.all([sb.rpc('admin_stats'), sb.rpc('admin_users'), sb.rpc('admin_tags'), sb.rpc('admin_tag_requests')]);
      if (st.error) { say('Non riesco a leggere i numeri ora. Riprova tra poco.'); return; }
      render(st.data, us.error ? null : us.data, tg.error ? null : tg.data || [], rq.error ? null : rq.data || []);
    } catch {
      say('Non riesco a collegarmi ora. Controlla la connessione e riprova.');
    } finally { $('refresh').disabled = false; }
  }
  $('refresh').onclick = load;
  load();
  setInterval(() => { if (!document.hidden && !$('refresh').hidden) load(); }, 120000);
})();
</script>
</body>
</html>
